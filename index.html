<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ink Swatch Journal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="hero">
    <p class="eyebrow">Fountain pen collection</p>
    <h1>Ink Swatch Journal</h1>
    <p class="intro">Every bottle and sample, logged as a swatch.</p>
  </header>

  <section class="toolbar">
    <input type="search" id="search" placeholder="Search ink or brand…" aria-label="Search inks">
    <button class="btn primary" id="addBtn" type="button">+ Add ink</button>
  </section>

  <p class="meta" id="count" aria-live="polite"></p>

  <section id="status" class="status" aria-live="polite">
    <p class="loading">Opening the journal…</p>
  </section>

  <section class="grid" id="grid" aria-label="Ink swatches">
    <div class="card skeleton" aria-hidden="true"><div class="swatch"></div><div class="card-body"><div class="sk sk-brand"></div><div class="sk sk-name"></div><div class="sk sk-note"></div></div></div>
    <div class="card skeleton" aria-hidden="true"><div class="swatch"></div><div class="card-body"><div class="sk sk-brand"></div><div class="sk sk-name"></div><div class="sk sk-note"></div></div></div>
    <div class="card skeleton" aria-hidden="true"><div class="swatch"></div><div class="card-body"><div class="sk sk-brand"></div><div class="sk sk-name"></div><div class="sk sk-note"></div></div></div>
  </section>

  <dialog id="dlg" aria-labelledby="dlgTitle">
    <form id="form" autocomplete="off">
      <h2 id="dlgTitle">Add ink</h2>
      <label>Ink name
        <input type="text" name="name" required pattern=".*\S.*" maxlength="80" placeholder="e.g. Oxblood">
      </label>
      <label>Brand
        <input type="text" name="brand" required pattern=".*\S.*" maxlength="60" placeholder="e.g. Diamine">
      </label>
      <fieldset class="rate">
        <legend>Color</legend>
        <div class="presets" id="presets" role="group" aria-label="Preset colors">
          <button type="button" class="preset" data-c="#6d1828" style="--c:#6d1828" aria-label="Oxblood red"></button>
          <button type="button" class="preset" data-c="#2ea8e0" style="--c:#2ea8e0" aria-label="Sky blue"></button>
          <button type="button" class="preset" data-c="#1f5c3d" style="--c:#1f5c3d" aria-label="Emerald green"></button>
          <button type="button" class="preset" data-c="#5b2d6e" style="--c:#5b2d6e" aria-label="Violet"></button>
          <button type="button" class="preset" data-c="#6e4a1f" style="--c:#6e4a1f" aria-label="Sepia brown"></button>
          <button type="button" class="preset" data-c="#2b2b2b" style="--c:#2b2b2b" aria-label="Ink black"></button>
        </div>
        <span class="color-row">
          <input type="color" id="custom" aria-label="Custom color">
          <span id="hex">#6d1828</span>
          <span class="preview" id="preview" aria-hidden="true"></span>
        </span>
        <label class="shade-row">Shade
          <input type="range" id="shade" min="0" max="100" value="50">
        </label>
        <input type="hidden" name="color" value="#6d1828">
      </fieldset>
      <label>Notes
        <textarea name="notes" rows="3" placeholder="Shading, sheen, behavior…"></textarea>
      </label>
      <fieldset class="rate">
        <legend>Rating</legend>
        <input type="hidden" name="rating" value="3">
        <div class="stars" id="stars">
          <button type="button" value="1" aria-label="Rate 1 out of 5" aria-pressed="true">★</button>
          <button type="button" value="2" aria-label="Rate 2 out of 5" aria-pressed="true">★</button>
          <button type="button" value="3" aria-label="Rate 3 out of 5" aria-pressed="true">★</button>
          <button type="button" value="4" aria-label="Rate 4 out of 5" aria-pressed="false">★</button>
          <button type="button" value="5" aria-label="Rate 5 out of 5" aria-pressed="false">★</button>
        </div>
      </fieldset>
      <div class="form-actions">
        <button type="button" class="btn" id="cancel">Cancel</button>
        <button type="submit" class="btn primary" id="submit">Save ink</button>
      </div>
    </form>
  </dialog>
</main>
<script src="app.js"></script>
</body>
</html>
